Object.assign(T.en,{pub:"Download updated website",dirty:"Unsaved changes – tap Download, then upload the file to your website host",np:"Create an owner password (at least 4 characters). Remember it!",pw:"Owner password",wp:"Wrong password",rs2:"Restore your unsaved changes?",ol:"Owner login"});
Object.assign(T.ur,{pub:"اپ ڈیٹ شدہ ویب سائٹ ڈاؤن لوڈ کریں",dirty:"تبدیلیاں محفوظ نہیں – ڈاؤن لوڈ کر کے فائل ہوسٹ پر اپ لوڈ کریں",np:"مالک کا پاس ورڈ بنائیں (کم از کم 4 حروف)۔ اسے یاد رکھیں!",pw:"مالک کا پاس ورڈ",wp:"غلط پاس ورڈ",rs2:"غیر محفوظ تبدیلیاں بحال کریں؟",ol:"مالک لاگ اِن"});
let lang='en',cat='all',q='',admin=false,dirty=false,img='';
try{lang=localStorage.getItem('lg')||'en'}catch(e){}
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cname=c=>c?(lang=='ur'&&c.ur?c.ur:c.en):'';
function num(n){n=String(n||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('0'))n='92'+n.slice(1);return n}
function render(){if(admin&&dirty)try{localStorage.setItem('shdraft',JSON.stringify(S))}catch(e){}
 const t=T[lang],s=S.shop;
 document.documentElement.lang=lang;document.documentElement.dir=lang=='ur'?'rtl':'ltr';
 app.innerHTML=`<div class="w"><header>${s.logo?`<img class="logo" src="${s.logo}" alt="${esc(s.name)}">`:''}<h1 class="${s.logo?'sr':''}">${esc(lang=='ur'&&s.nameUr?s.nameUr:s.name)}</h1>${s.tag?`<div class="tg">${esc(s.tag)}</div>`:''}<div class="sub">📍 ${esc(s.addr)}</div>
 <div class="bar"><button id="lg">${t.lg}</button></div></header>
 ${admin?`<div class="adm"><div class="sub">${t.own}</div><div class="bar"><button class="pri" id="ad">${t.add}</button><button id="ac">${t.ac}</button><button id="st">${t.set}</button><button class="pri" id="pb">${t.pub}</button></div>${dirty?`<div style="color:var(--ac)">${t.dirty}</div>`:''}</div>`:''}
 <input id="q" placeholder="${t.search}" value="${esc(q)}">
 <div class="bar" id="cats"><button data-c="all" class="${cat=='all'?'on':''}">${t.all}</button>${S.cats.map(c=>`<button data-c="${c.id}" class="${cat==c.id?'on':''}">${esc(cname(c))}</button>`).join('')}</div>
 <div id="grid"></div><footer>📍 ${esc(s.addr)}<br>📞 ${esc(s.phone)}${admin?'':`<br><a href="#" id="ol" style="color:var(--mu);font-size:.8rem">${t.ol}</a>`}</footer><div id="md"></div></div>`;
 $('#lg').onclick=()=>{lang=lang=='en'?'ur':'en';try{localStorage.setItem('lg',lang)}catch(e){}render()};
 $('#q').oninput=e=>{q=e.target.value.toLowerCase();grid()};
 $('#cats').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
 if(admin){$('#ad').onclick=()=>form();$('#st').onclick=settings;$('#pb').onclick=pub;$('#ac').onclick=()=>{const n=prompt(t.acp);if(n&&n.trim()){S.cats.push({id:'c'+Date.now(),en:n.trim(),ur:n.trim()});dirty=true;render()}}}
 grid();
 if($('#ol'))$('#ol').onclick=e=>{e.preventDefault();login()};
}
function grid(){
 const t=T[lang],s=S.shop,w=num(s.wa),p=String(s.phone||'').replace(/[^\d+]/g,'');
 const list=S.items.filter(i=>(cat=='all'||i.cat==cat)&&(!q||(i.name+' '+(i.nameUr||'')+' '+(i.desc||'')).toLowerCase().includes(q)));
 $('#grid').innerHTML=list.length?`<div class="grid">${list.map(i=>{
  const c=S.cats.find(x=>x.id==i.cat),nm=lang=='ur'&&i.nameUr?i.nameUr:i.name;
  return `<div class="card"><div class="im">${i.img?`<img src="${i.img}" alt="${esc(nm)}">`:'👗'}${i.sold?`<span class="tag">${t.sold}</span>`:''}</div><div class="bd"><div class="cn">${esc(cname(c))}</div><h3>${esc(nm)}</h3>${i.desc?`<p>${esc(i.desc)}</p>`:''}<div class="pr">${t.rs} ${esc(i.price)}</div>
  <div class="acts">${!i.sold&&w?`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent(t.hi+i.name)}">${t.wa}</a>`:''}${!i.sold&&p?`<a class="btn pri" href="tel:${p}">${t.call}</a>`:''}
  ${admin?`<button data-e="${i.id}">${t.edit}</button><button data-s="${i.id}">${i.sold?t.av:t.mk}</button><button data-d="${i.id}">${t.del}</button>`:''}</div></div></div>`}).join('')}</div>`:`<div class="empty">${t.none}</div>`;
 $('#grid').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.e)form(d.e);
  if(d.s){const i=S.items.find(x=>x.id==d.s);i.sold=!i.sold;dirty=true;render()}
  if(d.d&&confirm(t.cf)){S.items=S.items.filter(x=>x.id!=d.d);dirty=true;render()}}
}
function modal(h){$('#md').innerHTML=`<div class="ov"><div class="md">${h}</div></div>`}
function close(){$('#md').innerHTML=''}
function form(id){
 const t=T[lang],i=S.items.find(x=>x.id==id)||{};img=i.img||'';
 modal(`<h2>${id?t.edit:t.add}</h2><label>${t.nm}</label><input id="f1" value="${esc(i.name)}"><label>${t.nu}</label><input id="f2" value="${esc(i.nameUr)}">
 <label>${t.cat}</label><select id="f3">${S.cats.map(c=>`<option value="${c.id}" ${c.id==i.cat?'selected':''}>${esc(cname(c))}</option>`).join('')}</select>
 <label>${t.pr}</label><input id="f4" inputmode="numeric" value="${esc(i.price)}"><label>${t.ds}</label><textarea id="f5" rows="3">${esc(i.desc)}</textarea>
 <label>${t.ph}</label><input id="f6" type="file" accept="image/*"><img class="pv" id="pv" ${img?`src="${img}"`:'hidden'}>
 <div class="bar"><button class="pri" id="ok">${t.sv}</button><button id="no">${t.cl}</button></div>`);
 $('#no').onclick=close;
 $('#f6').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const k=Math.min(1,700/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*k;c.height=m.height*k;c.getContext('2d').drawImage(m,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.72);$('#pv').src=img;$('#pv').hidden=false};m.src=r.result};r.readAsDataURL(f)};
 $('#ok').onclick=()=>{const n=$('#f1').value.trim();if(!n){$('#f1').focus();return}
  const o={id:id||'i'+Date.now(),name:n,nameUr:$('#f2').value.trim(),cat:$('#f3').value,price:$('#f4').value.trim(),desc:$('#f5').value.trim(),img,sold:!!i.sold};
  if(id)S.items[S.items.findIndex(x=>x.id==id)]=o;else S.items.unshift(o);
  dirty=true;close();render()};
}
function settings(){
 const t=T[lang],s=S.shop;
 modal(`<h2>${t.set}</h2><label>${t.sn}</label><input id="s1" value="${esc(s.name)}"><label>${t.su}</label><input id="s2" value="${esc(s.nameUr)}">
 <label>${t.sp}</label><input id="s3" inputmode="tel" placeholder="03xx xxxxxxx" value="${esc(s.phone)}"><label>${t.sw}</label><input id="s4" inputmode="tel" placeholder="03xx xxxxxxx" value="${esc(s.wa)}">
 <label>${t.sa}</label><input id="s5" value="${esc(s.addr)}"><div class="bar"><button class="pri" id="ok">${t.sv}</button><button id="no">${t.cl}</button></div>`);
 $('#no').onclick=close;
 $('#ok').onclick=()=>{Object.assign(S.shop,{name:$('#s1').value.trim(),nameUr:$('#s2').value.trim(),phone:$('#s3').value.trim(),wa:$('#s4').value.trim(),addr:$('#s5').value.trim()});dirty=true;close();render()};
}
async function hx(s){s='shahana|'+s;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h}}
async function login(){const t=T[lang];

 else{const a=prompt(t.pw);if(!a||await hx(a)!==S.pw){alert(t.wp);return}
  try{const d=localStorage.getItem('shdraft');if(d&&d!=JSON.stringify(S)&&confirm(t.rs2)){Object.assign(S,JSON.parse(d));dirty=true}}catch(e){}}
 admin=true;render()}
