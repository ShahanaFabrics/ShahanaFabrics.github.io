S.reviews=S.reviews||[];S.offer=S.offer||{on:true,en:'New winter collection is here – message us on WhatsApp!',ur:'نیا ونٹر کلیکشن آ گیا ہے – واٹس ایپ پر پیغام کریں!'};
S.shop=Object.assign({hours:'',mapq:'',ig:'',fb:'',tt:'',grev:''},S.shop);
const url=u=>{u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:(u?'https://'+u:'')};
const T={en:{all:"All",search:"Search items…",sold:"Sold out",wa:"WhatsApp",call:"Call",none:"No items here yet.",add:"+ Add item",set:"Shop settings",pub:"Save & publish",dirty:"Unsaved changes – tap Save & publish",edit:"Edit",del:"Delete",mk:"Mark sold",av:"Mark available",cf:"Delete this item?",nm:"Name (English)",nu:"Name (Urdu, optional)",cat:"Category",pr:"Price (Rs)",ds:"Description",ph:"Photo",sv:"Save",cl:"Cancel",sn:"Shop name (English)",su:"Shop name (Urdu)",sp:"Phone number",sw:"WhatsApp number",sa:"Address",ac:"+ Category",acp:"New category name",lg:"اردو",hi:"Hello, I’m interested in: ",rs:"Rs",own:"Owner mode",er:"Could not publish. Make sure you’re signed in as the owner."},
ur:{all:"سب",search:"تلاش کریں…",sold:"فروخت ہو گیا",wa:"واٹس ایپ",call:"کال",none:"ابھی یہاں کوئی چیز نہیں۔",add:"+ نئی چیز",set:"دکان کی سیٹنگ",pub:"محفوظ اور شائع کریں",dirty:"تبدیلیاں محفوظ نہیں – شائع کریں دبائیں",edit:"ترمیم",del:"حذف",mk:"فروخت شدہ",av:"دستیاب",cf:"یہ چیز حذف کریں؟",nm:"نام (انگریزی)",nu:"نام (اردو، اختیاری)",cat:"زمرہ",pr:"قیمت (روپے)",ds:"تفصیل",ph:"تصویر",sv:"محفوظ",cl:"منسوخ",sn:"دکان کا نام (انگریزی)",su:"دکان کا نام (اردو)",sp:"فون نمبر",sw:"واٹس ایپ نمبر",sa:"پتہ",ac:"+ زمرہ",acp:"نئے زمرے کا نام",lg:"English",hi:"السلام علیکم، مجھے یہ چاہیے: ",rs:"روپے",own:"مالک موڈ – یہ بٹن صرف آپ کو نظر آتے ہیں",er:"شائع نہیں ہو سکا۔ مالک کے طور پر لاگ ان ہوں۔"}};
Object.assign(T.en,{pub:"Download updated website",dirty:"Unsaved changes – tap Download, then upload the file to your website host",np:"Create an owner password (at least 4 characters). Remember it!",pw:"Owner password",wp:"Wrong password",rs2:"Restore your unsaved changes?",ol:"Owner login"});
Object.assign(T.ur,{pub:"اپ ڈیٹ شدہ ویب سائٹ ڈاؤن لوڈ کریں",dirty:"تبدیلیاں محفوظ نہیں – ڈاؤن لوڈ کر کے فائل ہوسٹ پر اپ لوڈ کریں",np:"مالک کا پاس ورڈ بنائیں (کم از کم 4 حروف)۔ اسے یاد رکھیں!",pw:"مالک کا پاس ورڈ",wp:"غلط پاس ورڈ",rs2:"غیر محفوظ تبدیلیاں بحال کریں؟",ol:"مالک لاگ اِن"});
const getImgs=i=>i.imgs&&i.imgs.length?i.imgs:(i.img?[i.img]:[]);
const rs=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const k=Math.min(1,1100/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*k;c.height=m.height*k;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(m,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.88))};m.src=r.result};r.readAsDataURL(f)});
function lightbox(src){$('#md').innerHTML=`<div class="ov" id="lb" style="align-items:center"><img src="${src}" style="max-width:100%;max-height:90vh;border-radius:10px"></div>`;$('#lb').onclick=close}
Object.assign(T.en,{ph:"Photos (add one for each color)",co:"Available colors (e.g. Green, Maroon, Navy)"});
Object.assign(T.ur,{ph:"تصاویر (ہر رنگ کی ایک)",co:"دستیاب رنگ (مثلاً سبز، میرون، نیوی)"});
Object.assign(T.en,{addl:"+ Add to list",inl:"✓ In list",mylist:"My list",send:"Send list on WhatsApp",empty2:"Your list is empty.",note:"Color / size / note",total:"Total",chat:"Chat with us",hi0:"Hello Shahana Fabrics, I have a question.",ord:"Hello Shahana Fabrics, I would like to order:",new:"New",best:"Best seller",sale:"Sale",op:"Old price (optional, for sale)",tg:"Tag",none2:"None",rv:"Customer reviews",addrv:"+ Review",rname:"Customer name",rtext:"Review",rstar:"Stars",grev:"⭐ Review us on Google",hrs:"Opening hours",map:"Open in Google Maps",ig:"Instagram link",fb:"Facebook link",tt:"TikTok link",gr:"Google review link",mq:"Map search text (shop name + area)",of:"Offer banner (English)",ou:"Offer banner (Urdu)",oon:"Show offer banner",find:"Find us"});
Object.assign(T.ur,{addl:"+ لسٹ میں شامل کریں",inl:"✓ لسٹ میں ہے",mylist:"میری لسٹ",send:"لسٹ واٹس ایپ پر بھیجیں",empty2:"آپ کی لسٹ خالی ہے۔",note:"رنگ / سائز / نوٹ",total:"کل",chat:"ہم سے بات کریں",hi0:"السلام علیکم، مجھے ایک سوال پوچھنا ہے۔",ord:"السلام علیکم، میں یہ آرڈر کرنا چاہتا/چاہتی ہوں:",new:"نیا",best:"بیسٹ سیلر",sale:"سیل",op:"پرانی قیمت (اختیاری، سیل کے لیے)",tg:"ٹیگ",none2:"کوئی نہیں",rv:"گاہکوں کی رائے",addrv:"+ رائے",rname:"گاہک کا نام",rtext:"رائے",rstar:"ستارے",grev:"⭐ گوگل پر ریویو دیں",hrs:"اوقاتِ کار",map:"گوگل میپس میں کھولیں",ig:"انسٹاگرام لنک",fb:"فیس بک لنک",tt:"ٹک ٹاک لنک",gr:"گوگل ریویو لنک",mq:"میپ سرچ ٹیکسٹ (دکان کا نام + علاقہ)",of:"آفر بینر (انگریزی)",ou:"آفر بینر (اردو)",oon:"آفر بینر دکھائیں",find:"ہمیں تلاش کریں"});
let list=[];try{list=JSON.parse(localStorage.getItem('shlist')||'[]').filter(l=>S.items.some(x=>x.id==l.id))}catch(e){}
const saveList=()=>{try{localStorage.setItem('shlist',JSON.stringify(list))}catch(e){}};
let lang='en',cat='all',q='',admin=false,dirty=false,imgs=[];
try{lang=localStorage.getItem('lg')||'en'}catch(e){}
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cname=c=>c?(lang=='ur'&&c.ur?c.ur:c.en):'';
function num(n){n=String(n||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('0'))n='92'+n.slice(1);return n}
function render(){if(admin&&dirty)try{localStorage.setItem('shdraft',JSON.stringify(S))}catch(e){}
 const t=T[lang],s=S.shop;
 document.documentElement.lang=lang;document.documentElement.dir=lang=='ur'?'rtl':'ltr';
 app.innerHTML=`<div class="w"><header>${s.logo?`<img class="logo" src="${s.logo}" alt="${esc(s.name)}">`:''}<h1 class="${s.logo?'sr':''}">${esc(lang=='ur'&&s.nameUr?s.nameUr:s.name)}</h1>${s.tag?`<div class="tg">${esc(s.tag)}</div>`:''}<div class="sub">📍 ${esc(s.addr)}</div>
 <div class="bar"><button id="lg">${t.lg}</button></div></header>
 ${S.offer.on&&(lang=='ur'&&S.offer.ur?S.offer.ur:S.offer.en)?`<div class="ban">🎉 ${esc(lang=='ur'&&S.offer.ur?S.offer.ur:S.offer.en)}</div>`:''}
 ${admin?`<div class="adm"><div class="sub">${t.own}</div><div class="bar"><button class="pri" id="ad">${t.add}</button><button id="ac">${t.ac}</button><button id="st">${t.set}</button><button class="pri" id="pb">${t.pub}</button></div>${dirty?`<div style="color:var(--ac)">${t.dirty}</div>`:''}</div>`:''}
 <input id="q" placeholder="${t.search}" value="${esc(q)}">
 <div class="bar" id="cats"><button data-c="all" class="${cat=='all'?'on':''}">${t.all}</button>${S.cats.map(c=>`<button data-c="${c.id}" class="${cat==c.id?'on':''}">${esc(cname(c))}</button>`).join('')}</div>
 <div id="grid"></div><div id="rv"></div><footer><h2 style="color:var(--ac);margin:0 0 8px">${t.find}</h2>
 <iframe loading="lazy" title="map" src="https://maps.google.com/maps?q=${encodeURIComponent(s.mapq||s.name+' '+s.addr)}&output=embed" style="width:100%;height:220px;border:0;border-radius:12px"></iframe>
 <div>📍 ${esc(s.addr)}</div>${s.hours?`<div>🕒 ${esc(s.hours)}</div>`:''}<div>📞 ${esc(s.phone)}</div>
 <div class="bar"><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.mapq||s.name+' '+s.addr)}">📍 ${t.map}</a>${[['ig','Instagram'],['fb','Facebook'],['tt','TikTok']].map(([k,n])=>s[k]?`<a class="btn" target="_blank" rel="noopener" href="${esc(url(s[k]))}">${n}</a>`:'').join('')}</div>
 ${admin?'':`<a href="#" id="ol" style="color:var(--mu);font-size:.8rem">${t.ol}</a>`}</footer><div id="fabs"></div><div id="md"></div></div>`;
 $('#lg').onclick=()=>{lang=lang=='en'?'ur':'en';try{localStorage.setItem('lg',lang)}catch(e){}render()};
 $('#q').oninput=e=>{q=e.target.value.toLowerCase();grid()};
 $('#cats').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
 if(admin){$('#ad').onclick=()=>form();$('#st').onclick=settings;$('#pb').onclick=pub;$('#ac').onclick=()=>{const n=prompt(t.acp);if(n&&n.trim()){S.cats.push({id:'c'+Date.now(),en:n.trim(),ur:n.trim()});dirty=true;render()}}}
 grid();rvw();fabs();
 if($('#ol'))$('#ol').onclick=e=>{e.preventDefault();login()};
}
function grid(){
 const t=T[lang],s=S.shop,w=num(s.wa),p=String(s.phone||'').replace(/[^\d+]/g,'');
 const vis=S.items.filter(i=>(cat=='all'||i.cat==cat)&&(!q||(i.name+' '+(i.nameUr||'')+' '+(i.desc||'')).toLowerCase().includes(q)));
 $('#grid').innerHTML=vis.length?`<div class="grid">${vis.map(i=>{
  const c=S.cats.find(x=>x.id==i.cat),nm=lang=='ur'&&i.nameUr?i.nameUr:i.name,ims=getImgs(i);
  const pn=+String(i.price).replace(/\D/g,''),on=+String(i.old||'').replace(/\D/g,''),pct=pn&&on>pn?Math.round((1-pn/on)*100):0,inl=list.some(x=>x.id==i.id);
  return `<div class="card"><div class="im">${ims.length?`<img src="${ims[0]}" alt="${esc(nm)}">`:'👗'}${i.sold?`<span class="tag">${t.sold}</span>`:''}${pct?`<span class="tag tg2">-${pct}%</span>`:i.tag?`<span class="tag tg2">${t[i.tag]}</span>`:''}</div>${ims.length>1?`<div class="th">${ims.map((s,k)=>`<img src="${s}" data-k="${k}" data-id="${i.id}" class="${k?'':'on'}">`).join('')}</div>`:''}<div class="bd"><div class="cn">${esc(cname(c))}</div><h3>${esc(nm)}</h3>${i.desc?`<p>${esc(i.desc)}</p>`:''}${i.colors?`<div class="cn">🎨 ${esc(i.colors)}</div>`:''}<div class="pr">${pct?`<s style="color:var(--mu);font-weight:400">${t.rs} ${esc(i.old)}</s> `:''}${t.rs} ${esc(i.price)}</div>
  <div class="acts">${!i.sold?`<button data-l="${i.id}">${inl?t.inl:t.addl}</button>`:''}${!i.sold&&w?`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent(t.hi+i.name)}">${t.wa}</a>`:''}${!i.sold&&p?`<a class="btn pri" href="tel:${p}">${t.call}</a>`:''}
  ${admin?`<button data-e="${i.id}">${t.edit}</button><button data-s="${i.id}">${i.sold?t.av:t.mk}</button><button data-d="${i.id}">${t.del}</button>`:''}</div></div></div>`}).join('')}</div>`:`<div class="empty">${t.none}</div>`;
 $('#grid').onclick=e=>{const th=e.target.closest('.th img');
  if(th){const it=S.items.find(x=>x.id==th.dataset.id),card=th.closest('.card');card.querySelector('.im img').src=getImgs(it)[th.dataset.k];card.querySelectorAll('.th img').forEach(x=>x.classList.toggle('on',x==th));return}
  const bi=e.target.closest('.im img');if(bi){lightbox(bi.src);return}
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.l){const k=list.findIndex(x=>x.id==d.l);if(k<0)list.push({id:d.l,note:''});else list.splice(k,1);saveList();b.textContent=k<0?t.inl:t.addl;fabs()}
  if(d.e)form(d.e);
  if(d.s){const i=S.items.find(x=>x.id==d.s);i.sold=!i.sold;dirty=true;render()}
  if(d.d&&confirm(t.cf)){S.items=S.items.filter(x=>x.id!=d.d);dirty=true;render()}}
}
function modal(h){$('#md').innerHTML=`<div class="ov"><div class="md">${h}</div></div>`}
function close(){$('#md').innerHTML=''}
function form(id){
 const t=T[lang],i=S.items.find(x=>x.id==id)||{};imgs=[...getImgs(i)];
 modal(`<h2>${id?t.edit:t.add}</h2><label>${t.nm}</label><input id="f1" value="${esc(i.name)}"><label>${t.nu}</label><input id="f2" value="${esc(i.nameUr)}">
 <label>${t.cat}</label><select id="f3">${S.cats.map(c=>`<option value="${c.id}" ${c.id==i.cat?'selected':''}>${esc(cname(c))}</option>`).join('')}</select>
 <label>${t.pr}</label><input id="f4" inputmode="numeric" value="${esc(i.price)}"><label>${t.op}</label><input id="f8" inputmode="numeric" value="${esc(i.old)}"><label>${t.tg}</label><select id="f9">${[['',t.none2],['new',t.new],['best',t.best],['sale',t.sale]].map(([v,l])=>`<option value="${v}" ${v==(i.tag||'')?'selected':''}>${l}</option>`).join('')}</select><label>${t.ds}</label><textarea id="f5" rows="3">${esc(i.desc)}</textarea>
 <label>${t.co}</label><input id="f7" value="${esc(i.colors)}"><label>${t.ph}</label><input id="f6" type="file" accept="image/*" multiple><div class="th" id="pv"></div>
 <div class="bar"><button class="pri" id="ok">${t.sv}</button><button id="no">${t.cl}</button></div>`);
 $('#no').onclick=close;
 const pvr=()=>{$('#pv').innerHTML=imgs.map((s,k)=>`<div><img src="${s}"><b data-x="${k}">×</b></div>`).join('')};pvr();
 $('#pv').onclick=e=>{const k=e.target.dataset.x;if(k!=null){imgs.splice(+k,1);pvr()}};
 $('#f6').onchange=async e=>{for(const f of e.target.files)imgs.push(await rs(f));e.target.value='';pvr()};
 $('#ok').onclick=()=>{const n=$('#f1').value.trim();if(!n){$('#f1').focus();return}
  const o={id:id||'i'+Date.now(),name:n,nameUr:$('#f2').value.trim(),cat:$('#f3').value,price:$('#f4').value.trim(),desc:$('#f5').value.trim(),imgs,colors:$('#f7').value.trim(),old:$('#f8').value.trim(),tag:$('#f9').value,sold:!!i.sold};
  if(id)S.items[S.items.findIndex(x=>x.id==id)]=o;else S.items.unshift(o);
  dirty=true;close();render()};
}
function settings(){
 const t=T[lang],s=S.shop;
 modal(`<h2>${t.set}</h2><label>${t.sn}</label><input id="s1" value="${esc(s.name)}"><label>${t.su}</label><input id="s2" value="${esc(s.nameUr)}">
 <label>${t.sp}</label><input id="s3" inputmode="tel" placeholder="03xx xxxxxxx" value="${esc(s.phone)}"><label>${t.sw}</label><input id="s4" inputmode="tel" placeholder="03xx xxxxxxx" value="${esc(s.wa)}">
 <label>${t.sa}</label><input id="s5" value="${esc(s.addr)}"><label>${t.hrs}</label><input id="s6" placeholder="Mon–Sat 10 AM – 9 PM" value="${esc(s.hours)}"><label>${t.mq}</label><input id="s7" placeholder="Shahana Fabrics Board Bazar Peshawar" value="${esc(s.mapq)}">
 <label>${t.ig}</label><input id="s8" value="${esc(s.ig)}"><label>${t.fb}</label><input id="s9" value="${esc(s.fb)}"><label>${t.tt}</label><input id="s10" value="${esc(s.tt)}"><label>${t.gr}</label><input id="s11" value="${esc(s.grev)}">
 <label>${t.of}</label><input id="s12" value="${esc(S.offer.en)}"><label>${t.ou}</label><input id="s13" value="${esc(S.offer.ur)}"><label><input type="checkbox" id="s14" ${S.offer.on?'checked':''}> ${t.oon}</label><div class="bar"><button class="pri" id="ok">${t.sv}</button><button id="no">${t.cl}</button></div>`);
 $('#no').onclick=close;
 $('#ok').onclick=()=>{Object.assign(S.shop,{name:$('#s1').value.trim(),nameUr:$('#s2').value.trim(),phone:$('#s3').value.trim(),wa:$('#s4').value.trim(),addr:$('#s5').value.trim(),hours:$('#s6').value.trim(),mapq:$('#s7').value.trim(),ig:$('#s8').value.trim(),fb:$('#s9').value.trim(),tt:$('#s10').value.trim(),grev:$('#s11').value.trim()});S.offer={on:$('#s14').checked,en:$('#s12').value.trim(),ur:$('#s13').value.trim()};dirty=true;close();render()};
}
function fabs(){const t=T[lang],w=num(S.shop.wa);$('#fabs').innerHTML=`${list.length?`<button class="fab fl" id="fl">🛒 ${t.mylist} (${list.length})</button>`:''}${w?`<a class="fab" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent(t.hi0)}">💬 ${t.chat}</a>`:''}`;if($('#fl'))$('#fl').onclick=openList}
const pnum=v=>+String(v||'').replace(/\D/g,'')||0;
function openList(){const t=T[lang],w=num(S.shop.wa),rows=list.map((l,k)=>({l,k,i:S.items.find(x=>x.id==l.id)})).filter(r=>r.i);
 const tot=rows.reduce((a,r)=>a+pnum(r.i.price),0);
 const msg=()=>t.ord+'\n'+rows.map((r,n)=>`${n+1}. ${r.i.name} – Rs ${r.i.price}${r.l.note?' ('+r.l.note+')':''}`).join('\n')+(tot?`\n${t.total}: Rs ${tot}`:'');
 modal(`<h2>${t.mylist}</h2>${rows.map(r=>`<div style="display:flex;gap:8px;align-items:center"><div style="flex:1"><b>${esc(r.i.name)}</b><div class="cn">${t.rs} ${esc(r.i.price)}</div><input data-n="${r.k}" placeholder="${t.note}" value="${esc(r.l.note)}"></div><button data-r="${r.k}">×</button></div>`).join('')||`<div class="empty">${t.empty2}</div>`}${tot?`<b>${t.total}: ${t.rs} ${tot}</b>`:''}<div class="bar">${rows.length&&w?`<a class="btn wa" id="sd" target="_blank" rel="noopener">${t.send}</a>`:''}<button id="no">${t.cl}</button></div>`);
 const upd=()=>{const a=$('#sd');if(a)a.href=`https://wa.me/${w}?text=${encodeURIComponent(msg())}`};upd();
 $('#no').onclick=close;
 $('#md').onclick=e=>{const r=e.target.dataset.r;if(r!=null){list.splice(+r,1);saveList();fabs();grid();openList()}};
 $('#md').oninput=e=>{const n=e.target.dataset.n;if(n!=null){list[+n].note=e.target.value;saveList();upd()}}}
function rvw(){const t=T[lang],s=S.shop;
 $('#rv').innerHTML=(S.reviews.length||admin||s.grev)?`<h2 style="text-align:center;color:var(--ac)">${t.rv}</h2>${S.reviews.length?`<div class="grid">${S.reviews.map(r=>`<div class="card"><div class="bd"><div style="color:#b8902f">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div><p style="color:var(--tx)">${esc(r.text)}</p><div class="cn">— ${esc(r.name)}</div>${admin?`<div class="acts"><button data-rd="${r.id}">${t.del}</button></div>`:''}</div></div>`).join('')}</div>`:''}<div class="bar">${s.grev?`<a class="btn pri" target="_blank" rel="noopener" href="${esc(url(s.grev))}">${t.grev}</a>`:''}${admin?`<button id="ar">${t.addrv}</button>`:''}</div>`:'';
 $('#rv').onclick=e=>{if(e.target.id=='ar')rform();const d=e.target.dataset.rd;if(d&&confirm(t.cf)){S.reviews=S.reviews.filter(x=>x.id!=d);dirty=true;render()}}}
function rform(){const t=T[lang];modal(`<h2>${t.addrv}</h2><label>${t.rname}</label><input id="r1"><label>${t.rtext}</label><textarea id="r2" rows="3"></textarea><label>${t.rstar}</label><select id="r3">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select><div class="bar"><button class="pri" id="ok">${t.sv}</button><button id="no">${t.cl}</button></div>`);
 $('#no').onclick=close;$('#ok').onclick=()=>{const x=$('#r2').value.trim();if(!x)return;S.reviews.unshift({id:'r'+Date.now(),name:$('#r1').value.trim()||'Customer',text:x,stars:+$('#r3').value});dirty=true;close();render()}}
async function hx(s){s='shahana|'+s;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h}}
